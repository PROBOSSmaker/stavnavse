  }

  /* ---------- Создание спора ---------- */
  const form = {};
  function defaultResultAt() {
    const d = new Date(Date.now() + DAY);
    d.setMinutes(0, 0, 0);
    d.setHours(d.getHours() + 1);
    return d.getTime();
  }
  function resetForm() {
    Object.assign(form, { title: '', verify: 'link', source: '', result_at: defaultResultAt(), stake: 100, size: 3, side: null, custom: false, submitted: false });
  }
  resetForm();

  function renderCreate() {
    const s = summary();
    return `
      <main class="screen create">
        ${backLink()}
        <h1 class="page-h">Новый спор</h1>

        <label class="field">
          <span class="field-h">О чём спорим</span>
          <textarea id="f-title" rows="2" maxlength="${MAX_TITLE}" placeholder="Например: Саня пробежит полумарафон быстрее 2 часов">${esc(form.title)}</textarea>
          <span class="field-f"><span class="hint">Сформулируй так, чтобы ответить можно было только «да» или «нет».</span><span class="count" id="f-count">${form.title.length}/${MAX_TITLE}</span></span>
          <span class="err" data-err="title"></span>
        </label>

        <div class="field">
          <span class="field-h">Как проверить итог</span>
          <div class="seg seg2">
            <button type="button" data-verify="link">По ссылке</button>
            <button type="button" data-verify="on_demand">При необходимости</button>
          </div>
          <div class="field" id="f-link">
            <input id="f-source" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://" value="${esc(form.source)}" aria-label="Ссылка на источник">
            <span class="hint">Сайт с результатами, новость или прогноз. Если мнения разойдутся, арбитр посмотрит сюда.</span>
          </div>
          <div class="note-box" id="f-demand">${ICON.camera}<span>Ссылки не будет. Если мнения разойдутся, арбитр попросит участников прислать доказательства: фото, видео или скриншот. Участники увидят это до того, как поставят.</span></div>
          <span class="err" data-err="source"></span>
        </div>

        <label class="field">
          <span class="field-h">Когда станет известен итог</span>
          <input id="f-result" type="datetime-local" value="${toLocalInput(form.result_at || defaultResultAt())}" min="${toLocalInput(Date.now() + HOUR)}">
          <span class="hint">Не раньше чем через час: пока идёт набор, ответ ещё не должен быть известен. С этого момента у участников будет ${voteHoursText()}, чтобы отметить итог.</span>
          <span class="err" data-err="result_at"></span>
        </label>

        <div class="field">
          <span class="field-h">Ставка с каждого</span>
          <div class="chips">
            ${[50, 100, 200].map(v => `<button type="button" class="chip" data-stake="${v}">${v}</button>`).join('')}
            <button type="button" class="chip" data-stake="custom">Своя</button>
          </div>
          <input id="f-stake" type="number" inputmode="numeric" min="${MIN_STAKE}" step="1" placeholder="Сколько виртов" hidden>
          <span class="hint">У тебя ${fmt(s.available)} ${virts(s.available)}. Все участники ставят одинаково.</span>
          <span class="err" data-err="stake"></span>
        </div>

        <div class="field">
          <span class="field-h">Сколько человек, вместе с тобой</span>
          <div class="seg seg4">${[2, 3, 4, 5].map(n => `<button type="button" data-size="${n}">${n}</button>`).join('')}</div>
          <span class="err" data-err="size"></span>
        </div>

        <div class="field">
          <span class="field-h">Твоя сторона</span>
          <div class="pick-row">
            <button type="button" class="pick-btn yes" data-side="yes"><span class="big">Да</span></button>
            <button type="button" class="pick-btn no" data-side="no"><span class="big">Нет</span></button>
          </div>
          <span class="err" data-err="side"></span>
        </div>

        <section class="panel" id="f-summary"></section>

        <div>
          <button class="btn" type="button" id="f-submit" data-action="create-submit">Создать спор</button>
          <p class="fine">После создания у тебя будет час, чтобы собрать участников.</p>
        </div>
      </main>`;
  }

  function bindCreate() {
    const t = $('#f-title'), src = $('#f-source'), r = $('#f-result'), st = $('#f-stake');
    t.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
    t.addEventListener('input', () => {
      if (/\n/.test(t.value)) t.value = t.value.replace(/\n+/g, ' ');
      form.title = t.value;
      $('#f-count').textContent = `${t.value.length}/${MAX_TITLE}`;
      updateCreate();
    });
    src.addEventListener('input', () => { form.source = src.value; updateCreate(); });
    const onDate = () => { form.result_at = r.value ? fromLocalInput(r.value) : null; updateCreate(); };
    r.addEventListener('input', onDate);
    r.addEventListener('change', onDate);
    st.addEventListener('input', () => { const v = st.value.trim(); form.stake = v === '' ? NaN : Number(v); updateCreate(); });
    if (form.custom && Number.isFinite(form.stake)) st.value = form.stake;
    updateCreate();
  }

  function updateCreate() {
    if (!$('#f-summary')) return;
    const avail = summary().available;
    document.querySelectorAll('[data-stake]').forEach(el => {
      const v = el.dataset.stake;
      el.classList.toggle('on', form.custom ? v === 'custom' : Number(v) === form.stake);
      if (v !== 'custom') el.disabled = Number(v) > avail;
    });
    $('#f-stake').hidden = !form.custom;
    document.querySelectorAll('[data-verify]').forEach(el => el.classList.toggle('on', el.dataset.verify === form.verify));
    $('#f-link').hidden = form.verify === 'on_demand';
    $('#f-demand').hidden = form.verify !== 'on_demand';
    document.querySelectorAll('[data-size]').forEach(el => el.classList.toggle('on', Number(el.dataset.size) === form.size));
    document.querySelectorAll('[data-side]').forEach(el => el.classList.toggle('on', el.dataset.side === form.side));

    const errors = validateNew(form);
    document.querySelectorAll('[data-err]').forEach(el => {
      const k = el.dataset.err;
      const show = form.submitted || (k === 'stake' && Number.isFinite(form.stake));
      const msg = show ? (errors[k] || '') : '';
      el.textContent = msg;
      el.closest('.field').classList.toggle('bad', !!msg);
    });

    const ok = Number.isInteger(form.stake) && form.stake >= MIN_STAKE;
    $('#f-summary').innerHTML = ok
      ? `<div class="row"><span>Ты ставишь</span><b>${fmt(form.stake)} ${virts(form.stake)}</b></div>
         <div class="row"><span>Банк, если придут все ${form.size}</span><b>${fmt(form.stake * form.size)}</b></div>
         <div class="row"><span>Если угадаешь только ты</span><b class="t-yes">+${fmt(form.stake * (form.size - 1))}</b></div>`
      : '<div class="row"><span>Укажи ставку — здесь появится расчёт банка.</span></div>';

    const btn = $('#f-submit');
    btn.textContent = ok ? `Создать и заморозить ${fmt(form.stake)} ${virts(form.stake)}` : 'Создать спор';
    btn.classList.toggle('off', Object.keys(errors).length > 0);
  }

  function pickStake(v) {
    haptic('select');
    if (v === 'custom') {
      form.custom = true;
      form.stake = NaN;
      updateCreate();
      const i = $('#f-stake');
      i.value = '';
      i.focus();
      return;
    }
    form.custom = false;
    form.stake = Number(v);
    updateCreate();
  }

  function submitCreate() {
    form.submitted = true;
    const res = api.create(form);
    if (res.errors) {
      updateCreate();
      notify('error');
      const bad = document.querySelector('.field.bad');
      if (bad) bad.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    notify('success');
    state.tab = 'recruiting';
    stack[stack.length - 1] = 'bet:' + res.bet.id;   // экран создания заменяем страницей спора
    render();
    toast('Спор создан. Зови друзей — на сбор есть час.');
  }

  /* ---------- Страница спора ---------- */
  function renderBet(id) {
    const b = bets.find(x => x.id === id);
    if (!b) return renderNotFound();
    const m = mine(b), s = summary(), st = statusInfo(b);
    const recruiting = b.status === 'recruiting';
    const invite = recruiting && !m;

    const facts = `
      <div class="facts">
        ${onDemand(b)
          ? `<div class="fact">${ICON.camera}<span>Проверка: <b>при необходимости</b></span></div>`
          : `<button type="button" class="fact link" data-open="${esc(b.source)}">${ICON.link}<span>${esc(hostOf(b.source))}</span>${ICON.out}</button>`}
        ${isLive(b)
          ? `<div class="fact">${ICON.flag}<span>Итог: <b>${dateTime(b.result_at)}</b></span></div>`
          : `<div class="fact">${ICON.flag}<span>${b.status === 'cancelled' ? 'Отменён' : 'Завершён'}: <b>${dateShort(b.resolved_at)}</b></span></div>`}
        <div class="fact">${ICON.user}<span>Автор: <b>${esc(b.creator === ME ? 'ты' : users[b.creator].name)}</b>${b.creator === ME ? '' : ` · рейтинг <b>${rating(b.creator).value}</b>`}</span></div>
      </div>`;

    let bankNote;
    if (recruiting) bankNote = `ставка ${fmt(b.stake)} с каждого<br>до ${fmt(b.stake * b.size)}, если придут все`;
    else if (b.status === 'cancelled') bankNote = 'все ставки вернулись';
    else if (b.status === 'resolved') bankNote = `исход ${sideWord(b.outcome)}`;
    else bankNote = `ставка ${fmt(b.stake)} с каждого<br>${b.participants.length} ${plural(b.participants.length, 'участник', 'участника', 'участников')}`;
    const bankBox = `
      <section class="bankbox">
        <div><div class="eyebrow">Банк</div><div class="num">${fmt(bank(b))}</div></div>
        <div class="bank-note">${bankNote}</div>
      </section>`;

    let block = '', mode = 'plain', actions = '';

    if (invite) {
      const allowed = allowedSides(b);
      const pick = state.pick && state.pick.id === b.id && allowed.indexOf(state.pick.side) >= 0 ? state.pick.side : null;
      const short = s.available < b.stake;
      const emptySide = !sideCount(b, 'yes') ? 'yes' : !sideCount(b, 'no') ? 'no' : null;
      const sideHint = allowed.length === 1
        ? `<p class="hint center need">Осталось одно место — только за «${sideName(allowed[0])}», чтобы в споре были обе стороны.</p>`
        : emptySide
          ? `<p class="hint center need">Нужен хотя бы один за «${sideName(emptySide)}» — без этого спор не начнётся.</p>`
          : '';
      block = `
        ${onDemand(b) ? `<div class="note-box warn">${ICON.camera}<span><b>Проверка при необходимости.</b> Ссылки на источник нет: если мнения разойдутся, арбитр попросит участников прислать фото или видео.</span></div>` : ''}
        <section>
          <div class="pick-h">На чьей ты стороне?</div>
          <div class="pick-row">
            ${['yes', 'no'].map(sd => `
              <button type="button" class="pick-btn ${sd}${pick === sd ? ' on' : ''}" data-pick="${sd}" ${allowed.indexOf(sd) < 0 ? 'disabled' : ''}>
                <span class="big">${sideName(sd)}</span><span class="sub">${sideCount(b, sd) ? 'сейчас ' + sideCount(b, sd) : 'пока никого'}</span>
              </button>`).join('')}
          </div>
          ${sideHint}
        </section>`;
      actions = `
        <div>
          <button type="button" class="btn${pick && !short ? '' : ' off'}" data-action="join">
            ${short ? 'Не хватает виртов' : pick ? `Поставить ${fmt(b.stake)} ${virts(b.stake)} на «${sideName(pick)}»` : 'Выбери сторону'}
          </button>
          <p class="fine">У тебя ${fmt(s.available)} ${virts(s.available)}. Ставка заморозится сразу, и выйти из спора будет нельзя: ставки вернутся, только если автор отменит спор до старта.</p>
        </div>`;
    } else if (recruiting && isCreator(b)) {
      const canStart = sideCount(b, 'yes') > 0 && sideCount(b, 'no') > 0;
      actions = `
        <div class="stack">
          <button type="button" class="btn" data-action="share">Позвать друзей</button>
          <button type="button" class="btn ghost" data-action="copy">Скопировать ссылку</button>
          <button type="button" class="btn ghost${canStart ? '' : ' off'}" data-action="begin">Начать без остальных</button>
          ${canStart ? '' : '<p class="hint center">Начать можно, когда на каждой стороне будет хотя бы один человек.</p>'}
          <button type="button" class="link-danger" data-action="cancel">Отменить спор</button>
        </div>
        <p class="fine" style="margin-top:-6px">Если за час спор не начнётся, он отменится сам и все ставки вернутся.</p>`;
    } else if (recruiting) {
      block = `<div class="note-box">${ICON.lock}<span>Ты в споре за ${sideWord(m.side)}, ставка заморожена. Спор начнётся, когда наберутся все или автор нажмёт «Начать».</span></div>`;
      actions = `
        <div>
          <button type="button" class="btn ghost" data-action="share">Позвать ещё друзей</button>
          <p class="fine">Если за час спор не начнётся, он отменится и ставки вернутся.</p>
        </div>`;
    } else if (b.status === 'active' && !canReport(b)) {
      block = `<div class="note-box">${ICON.clock}<span>Итог можно будет отметить <b>${dateTime(b.result_at)}</b>, на ответ будет ${voteHoursText()}. До этого ставки заморожены.</span></div>`;
    } else if (b.status === 'active' && m && !m.report) {
      mode = 'reports';
      const done = b.participants.filter(x => x.report).length;
      block = `
        <section>
          <div class="pick-h">Чем всё закончилось?</div>
          <div class="pick-row">
            <button type="button" class="pick-btn yes" data-report="yes"><span class="big">Да</span></button>
            <button type="button" class="pick-btn no" data-report="no"><span class="big">Нет</span></button>
          </div>
          <p class="hint center">Отметили ${done} из ${b.participants.length}. Ответить нужно до <b>${dateTime(voteDeadline(b))}</b>, иначе рейтинг снизится на ${-RATING.silent}.</p>
        </section>`;
      actions = `<p class="fine" style="margin-top:0">Отметить можно один раз. ${onDemand(b) ? '' : 'Сомневаешься — загляни в источник. '}Если все ответят одинаково, банк разделится сразу. Если ответы разойдутся или кто-то не ответит за ${voteHoursText()}, решит арбитр.</p>`;
    } else if (b.status === 'active') {
      mode = 'reports';
      const done = b.participants.filter(x => x.report).length;
      block = `<div class="note-box">${ICON.check}<span>${m ? `Твой ответ: ${sideWord(m.report)}. ` : ''}Ждём остальных: отметили ${done} из ${b.participants.length}. Ответы откроются, когда отметят все. Если кто-то не ответит до <b>${dateTime(voteDeadline(b))}</b>, итог решит арбитр.</span></div>`;
    } else if (b.status === 'review') {
      mode = 'answers';
      block = reviewBlock(b);
    } else if (b.status === 'resolved') {
      mode = 'answers';
      block = resultBlock(b);
      actions = payoutPanel(b);
    } else {
      block = `<div class="note-box">${ICON.lock}<span>${b.cancel_reason === 'creator' ? 'Автор отменил спор' : 'Спор не начался за час'} — все ставки вернулись.</span></div>`;
    }

    return `
      <main class="screen bet">
        ${backLink()}
        ${invite ? `<div class="eyebrow invite">${esc(users[b.creator].name)} зовёт тебя поспорить</div>` : ''}
        <div class="bet-top">
          <span class="status ${st.cls}">${st.text}</span>
          ${recruiting
            ? `<span class="meta">${ICON.clock}<span data-deadline="${deadlineOf(b)}">${mmss(deadlineOf(b) - Date.now())}</span></span>`
            : canReport(b)
              ? `<span class="meta">${ICON.clock}<span data-deadline="${voteDeadline(b)}" data-fmt="long">${longLeft(voteDeadline(b) - Date.now())}</span></span>`
              : ''}
        </div>
        <h1 class="bet-title">${esc(b.title)}</h1>
        ${facts}
        ${b.status === 'resolved' ? '' : bankBox}
        ${block}
        ${teams(b, mode)}
        ${actions}
        ${demoPanel(b)}
      </main>`;
  }

  function renderNotFound() {
    return `
      <main class="screen">
        ${backLink()}
        <div class="empty">Спор не найден. Возможно, ссылка устарела или спор удалили.</div>
        <button class="btn" type="button" data-action="home">На главную</button>
      </main>`;
  }

  /* =====================================================================
     Навигация
     ===================================================================== */
  const app = $('#app');
  const state = { tab: 'active', pick: null };
  let stack = [], lastPhase = '';

  const routeOf = () => stack[stack.length - 1] || 'home';
  function currentBet() {
    const r = routeOf();
    return r.indexOf('bet:') === 0 ? bets.find(x => x.id === r.slice(4)) || null : null;
  }
  function phase() {
    const b = currentBet();
    return routeOf() + (b ? `|${b.status}|${canReport(b) ? 1 : 0}|${b.participants.length}|${b.participants.filter(x => x.report).length}` : '');
  }

  function render(keepScroll) {
    sweep();
    const r = routeOf(), name = r.split(':')[0];
    app.innerHTML =
      name === 'onboarding' ? renderOnboarding(stack.length === 1) :
      name === 'profile' ? renderProfile() :
      name === 'create' ? renderCreate() :
      name === 'bet' ? renderBet(r.slice(4)) :
      renderHome();
    if (!keepScroll) {
      if (name !== 'onboarding') app.firstElementChild.classList.add('enter');
      window.scrollTo(0, 0);
    }
    if (atLeast('6.1')) { if (stack.length > 1) tg.BackButton.show(); else tg.BackButton.hide(); }
    if (name === 'onboarding') countUp($('#startBalance'), START_BALANCE);
    if (name === 'create') bindCreate();
    lastPhase = phase();
    updateTimers();
  }
  function go(route) { haptic('light'); stack.push(route); render(); }
  function back() {
    if (sheetDone) return closeSheet(false);
    if (stack.length > 1) stack.pop(); else stack = ['home'];
    render();
  }
  if (atLeast('6.1')) tg.BackButton.onClick(back);

  /* ---------- Действия на странице спора ---------- */
  async function doJoin() {
    const b = currentBet();
    if (!b) return;
    const side = state.pick && state.pick.id === b.id ? state.pick.side : null;
    if (summary().available < b.stake) { notify('error'); return toast('Не хватает виртов для этой ставки.'); }
    if (!side) { notify('warning'); return toast('Сначала выбери сторону: «Да» или «Нет».'); }
    const ok = await ask({
      title: `Ставишь ${fmt(b.stake)} ${virts(b.stake)} на «${sideName(side)}»?`,
      text: 'Ставка заморозится сразу. Выйти из спора будет нельзя.' +
        (onDemand(b) ? ' Проверка при необходимости: если мнения разойдутся, арбитр может попросить фото или видео.' : ''),
      ok: 'Поставить'
    });
    if (!ok) return;
    const err = api.join(b, side);
    if (err) { notify('error'); return toast(err); }
    notify('success');
    state.pick = null;
    state.tab = b.status === 'active' ? 'active' : 'recruiting';
    render();
    toast(b.status === 'active' ? 'Все в сборе — спор начался!' : 'Ты в споре. Ставка заморожена.');
  }

  async function doBegin() {
    const b = currentBet();
    if (!b) return;
    if (!sideCount(b, 'yes') || !sideCount(b, 'no')) { notify('warning'); return toast('Нужен хотя бы один человек на каждой стороне.'); }
    const n = b.participants.length;
    const ok = await ask({
      title: 'Начать без остальных?',
      text: `Свободные места закроются, спор начнётся с теми, кто уже вошёл: ${n} ${people(n)}.`,
      ok: 'Начать'
    });
    if (!ok) return;
    const err = api.start(b);
    if (err) { notify('error'); return toast(err); }
    notify('success');
    state.tab = 'active';
    render();
    toast('Спор начался. Ставки заморожены до итога.');
  }

  async function doCancel() {
    const b = currentBet();
    if (!b) return;
    const ok = await ask({
      title: 'Отменить спор?',
      text: 'Всем участникам вернутся ставки. Вернуть спор после отмены не получится.',
      ok: 'Отменить спор',
      danger: true
    });
    if (!ok) return;
    const err = api.cancel(b);
    if (err) { notify('error'); return toast(err); }
    notify('success');
    render();
    toast('Спор отменён, ставки вернулись.');
  }

  async function doReport(side) {
    const b = currentBet();
    if (!b) return;
    const ok = await ask({ title: `Итог — «${sideName(side)}»?`, text: 'Изменить ответ потом не получится.', ok: 'Отметить' });
    if (!ok) return;
    const err = api.report(b, side);
    if (err) { notify('error'); return toast(err); }
    notify('success');
    render();
    if (b.status === 'resolved') toast('Все согласились — банк разделён.');
    else if (b.status === 'review') toast('Мнения разошлись — спор ушёл арбитру.');
    else toast('Ответ принят. Ждём остальных.');
  }

  function doDemo(k) {
    const b = currentBet();
    if (!b) return;
    const before = b.status;
    if (k === 'add') demo.addParticipant(b);
    else if (k === 'ff') demo.fastForward(b);
    else if (k === 'agree') demo.othersReport(b, true);
    else if (k === 'disagree') demo.othersReport(b, false);
    else if (k === 'arb-yes') demo.arbiter(b, 'yes');
    else if (k === 'arb-no') demo.arbiter(b, 'no');
    else if (k === 'proof') demo.requestProof(b);
    else if (k === 'timeup') demo.timeUp(b);
    haptic('light');
    render(true);
    if (k === 'proof') toast('Арбитр просит доказательства. Участникам придёт уведомление.');
    if (before !== b.status) {
      if (b.status === 'active') toast('Все в сборе — спор начался!');
      else if (b.status === 'resolved') toast(b.resolved_by === 'arbiter' ? 'Арбитр вынес решение.' : 'Все согласились — банк разделён.');
      else if (b.status === 'review') toast(b.review_reason === 'timeout' ? `Не все ответили за ${voteHoursText()} — спор ушёл арбитру.` : 'Мнения разошлись — спор ушёл арбитру.');
    }
  }

  async function doReset() {
    const ok = await ask({
      title: 'Сбросить тестовые данные?',
      text: 'Споры, которые ты создал в прототипе, пропадут, вернутся исходные примеры.',
      ok: 'Сбросить',
      danger: true
    });
    if (!ok) return;
    bets = seed();
    save();
    state.tab = 'active';
    stack = ['home'];
    render();
    toast('Тестовые данные сброшены.');
  }

  /* ---------- Ссылки ---------- */
  const inviteLink = b => `https://t.me/${BOT}?startapp=bet_${b.id}`;

  function share(b) {
    const link = inviteLink(b);
    const text = `Спорим? «${b.title}». Ставка ${fmt(b.stake)} ${virts(b.stake)}. Заходи, пока идёт набор:`;
    haptic('light');
    if (inTelegram && atLeast('6.1')) {
      tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`);
      return;
    }
    if (navigator.share) { navigator.share({ text, url: link }).catch(() => {}); return; }
    copy(link);
  }

  function copy(text) {
    const done = () => { notify('success'); toast('Ссылка скопирована. Отправь её друзьям.'); };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast(text); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function openSource(url) {
    if (!isUrl(url)) return;
    haptic('light');
    try { if (inTelegram && typeof tg.openLink === 'function') { tg.openLink(url); return; } } catch (e) {}
    window.open(url, '_blank', 'noopener');
  }

  /* ---------- Клики ---------- */
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-tab],[data-action],[data-back],[data-bet],[data-stake],[data-size],[data-side],[data-verify],[data-pick],[data-report],[data-open],[data-demo]');
    if (!t || t.disabled) return;
    const d = t.dataset;
    if ('back' in d) return back();
    if (d.go) return go(d.go);
    if (d.tab) {
      if (state.tab !== d.tab) { state.tab = d.tab; haptic('select'); render(true); }
      return;
    }
    if (d.bet) return go('bet:' + d.bet);
    if (d.stake) return pickStake(d.stake);
    if (d.size) { form.size = Number(d.size); haptic('select'); return updateCreate(); }
    if (d.side) { form.side = d.side; haptic('select'); return updateCreate(); }
    if (d.verify) { form.verify = d.verify; haptic('select'); return updateCreate(); }
    if (d.pick) {
      const b = currentBet();
      if (b) { state.pick = { id: b.id, side: d.pick }; haptic('select'); render(true); }
      return;
    }
    if (d.report) return doReport(d.report);
    if (d.open) return openSource(d.open);
    if (d.demo) return doDemo(d.demo);

    switch (d.action) {
      case 'create': resetForm(); return go('create');
      case 'create-submit': return submitCreate();
      case 'join': return doJoin();
      case 'share': { const b = currentBet(); return b && share(b); }
      case 'copy': { const b = currentBet(); return b && copy(inviteLink(b)); }
      case 'begin': return doBegin();
      case 'cancel': return doCancel();
      case 'welcome-done': haptic('medium'); store.set('snv_onboarded', '1'); stack = ['home']; return render();
      case 'back': return back();
      case 'home': stack = ['home']; return render();
      case 'reset': return doReset();
    }
  });
  app.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-bet]')) { e.preventDefault(); e.target.click(); }
  });
  // Выбрали файл-доказательство
  app.addEventListener('change', e => {
    const inp = e.target;
    if (!inp.matches || !inp.matches('input[data-proof]') || !inp.files || !inp.files.length) return;
    const b = currentBet();
    if (!b) return;
    const file = inp.files[0];
    const err = api.sendProof(b, { name: file.name, type: file.type, size: file.size });
    if (err) { notify('error'); return toast(err); }
    notify('success');
    render(true);
    toast('Отправлено арбитру.');
  });

  /* ---------- Окно подтверждения ---------- */
  const sheetEl = $('#sheet');
  let sheetDone = null;
  function ask({ title, text, ok, danger }) {
    return new Promise(resolve => {
      sheetEl.innerHTML = `
        <div class="sheet-card" role="dialog" aria-modal="true">
          <h3>${esc(title)}</h3>
          <p>${esc(text)}</p>
          <div class="sheet-actions">
            <button type="button" class="btn ghost" data-sheet="0">Назад</button>
            <button type="button" class="btn${danger ? ' danger' : ''}" data-sheet="1">${esc(ok)}</button>
          </div>
        </div>`;
      sheetDone = resolve;
      sheetEl.classList.add('show');
      if (atLeast('6.1')) tg.BackButton.show();
      haptic('light');
    });
  }
  function closeSheet(result) {
    if (!sheetDone) return;
    const done = sheetDone;
    sheetDone = null;
    sheetEl.classList.remove('show');
    if (atLeast('6.1') && stack.length < 2) tg.BackButton.hide();
    done(result);
  }
  sheetEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-sheet]');
    if (btn) closeSheet(btn.dataset.sheet === '1');
    else if (e.target === sheetEl) closeSheet(false);
  });

  /* =====================================================================
     Мелочи: таймеры, счётчик, тост
     ===================================================================== */
  function updateTimers() {
    document.querySelectorAll('[data-deadline]').forEach(el => {
      const left = Number(el.dataset.deadline) - Date.now();
      el.textContent = left > 0 ? (el.dataset.fmt === 'long' ? longLeft(left) : mmss(left)) : 'время вышло';
    });
  }
  setInterval(() => {
    const changed = sweep();
    updateTimers();
    if (sheetDone || routeOf() === 'create') return;
    if (changed || phase() !== lastPhase) render(true);
  }, 1000);

  function countUp(el, to) {
    if (!el || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    el.textContent = '0';
    setTimeout(() => {
      const t0 = performance.now(), dur = 900;
      const step = t => {
        const k = Math.max(0, Math.min(1, (t - t0) / dur));
        el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, 350);
  }

  const toastEl = $('#toast');
  let toastTimer;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
  }

  /* =====================================================================
     Старт: ссылка-приглашение → сразу спор; первый запуск → приветствие
     ===================================================================== */
  const hash = location.hash.replace('#', '');
  if (startParam && /^bet_[A-Za-z0-9_-]+$/.test(startParam)) {
    store.set('snv_onboarded', '1');
    stack = ['home', 'bet:' + startParam.slice(4)];
  } else if (hash.indexOf('bet/') === 0) {
    stack = ['home', 'bet:' + hash.slice(4)];
  } else if (hash === 'profile' || hash === 'onboarding' || hash === 'create') {
    stack = ['home', hash];
  } else if (hash === 'home' || store.get('snv_onboarded')) {
    stack = ['home'];
  } else {
    stack = ['onboarding'];
  }
  render();
})();
</script>
</body>
</html>
