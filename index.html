<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<title>Ставь на всё</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Основа */
    --graphite: #0F0F0F;
    --coal: #1C1C1C;
    --cocoa: #4A3B31;
    /* Бренд */
    --bronze: #8C6A4F;
    --latte: #C7B299;
    --cream: #F2E8DA;
    /* Действие */
    --copper: #E0874A;
    --yes: #8FC79A;
    --no: #E0745F;

    --line: rgba(74, 59, 49, .65);
    --display: 'Unbounded', system-ui, sans-serif;
    --text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--graphite); color: var(--cream); }

  body {
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.45;
    min-height: var(--tg-viewport-stable-height, 100vh);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(120% 100% at 50% -25%, rgba(140, 106, 79, .22), transparent 70%) top center / 100% 560px no-repeat,
      var(--graphite);
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
  [hidden] { display: none !important; }

  .screen {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 32px);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .screen.enter { animation: enter .35s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--latte);
    opacity: .8;
  }
  .num { font-family: var(--display); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .ic {
    width: 14px; height: 14px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .t-yes { color: var(--yes); }
  .t-no { color: var(--no); }
  .hint { font-size: 12.5px; color: var(--latte); opacity: .8; line-height: 1.4; }
  .hint.center { text-align: center; }
  .fine { margin-top: 12px; text-align: center; font-size: 13px; color: var(--latte); opacity: .7; line-height: 1.45; }

  /* ---------- Кнопки ---------- */
  .btn {
    display: block;
    width: 100%;
    height: 56px;
    border-radius: 16px;
    background: var(--copper);
    color: var(--graphite);
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .01em;
    text-align: center;
    box-shadow: 0 12px 30px -14px rgba(224, 135, 74, .7);
    transition: transform .12s ease, filter .12s ease, opacity .2s ease;
  }
  .btn:active { transform: scale(.98); filter: brightness(.95); }
  .btn.off { opacity: .45; box-shadow: none; }
  .btn.ghost {
    height: 50px;
    background: transparent;
    border: 1px solid var(--cocoa);
    color: var(--cream);
    font-family: var(--text);
    font-weight: 600;
    box-shadow: none;
  }
  .btn.danger { background: var(--no); box-shadow: 0 12px 30px -14px rgba(224, 116, 95, .7); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .back {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--latte);
    padding: 4px 0;
  }
  .link-danger { align-self: center; color: var(--no); font-size: 14.5px; font-weight: 600; padding: 8px 12px; }
  .link-muted { align-self: center; color: var(--latte); opacity: .7; font-size: 13.5px; padding: 6px 12px; }

  /* ---------- Аватарки ---------- */
  .ava {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    overflow: hidden;
    flex: none;
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
  }
  .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ava.c0 { background: var(--cream); color: var(--graphite); }
  .ava.c1 { background: var(--latte); color: var(--graphite); }
  .ava.c2 { background: var(--bronze); color: var(--cream); }
  .ava.c3 { background: var(--cocoa); color: var(--cream); }
  .ava.sm { width: 26px; height: 26px; font-size: 11px; border: 2px solid var(--coal); }
  .ava.sm.me { border-color: var(--cream); }
  .ava.xl { width: 84px; height: 84px; font-size: 32px; }
  .faces { display: inline-flex; }
  .faces .ava + .ava { margin-left: -8px; }

  /* ---------- Главная ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .02em; }
  .logo em { font-style: normal; color: var(--latte); }
  .mark-sm { width: 34px; height: auto; }
  .ava-btn { border-radius: 50%; }

  .wallet { background: var(--coal); border: 1px solid var(--cocoa); border-radius: 22px; padding: 18px; }
  .amount { margin-top: 8px; display: flex; align-items: baseline; gap: 8px; }
  .amount .num { font-size: 44px; }
  .amount .cur { color: var(--latte); }
  .frozen { margin-top: 10px; display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--latte); }
  .wallet .btn { margin-top: 16px; }

  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 4px;
    background: var(--coal);
    border: 1px solid var(--cocoa);
    border-radius: 14px;
  }
  .seg.seg4 { grid-template-columns: repeat(4, 1fr); }
  .seg button {
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--latte);
    transition: background .2s ease, color .2s ease;
  }
  .seg.seg4 button { font-family: var(--display); font-weight: 700; font-size: 15px; height: 42px; }
  .seg button.on { background: var(--cocoa); color: var(--cream); }
  .seg .cnt { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ---------- Карточка спора в списке ---------- */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--coal);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    cursor: pointer;
    outline: none;
    transition: transform .12s ease;
  }
  .card:active { transform: scale(.985); }
  .card:focus-visible { border-color: var(--latte); }
  .card.attention { border-color: rgba(224, 135, 74, .55); }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 24px; }
  .status { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--latte); }
  .status.muted { opacity: .6; }
  .status.t-yes { color: var(--yes); }
  .status.t-no { color: var(--no); }
  .meta { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--latte); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip-action {
    font-size: 12px;
    font-weight: 700;
    color: var(--copper);
    border: 1px solid rgba(224, 135, 74, .5);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .card h3 { font-size: 16.5px; font-weight: 600; line-height: 1.3; }
  .sides { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .side { display: flex; align-items: center; gap: 8px; }
  .side.dim { opacity: .38; }
  .side .lbl { font-size: 13px; font-weight: 700; }
  .side.yes .lbl { color: var(--yes); }
  .side.no .lbl { color: var(--no); }
  .nobody { font-size: 12.5px; color: var(--latte); opacity: .7; }
  .split { display: flex; gap: 3px; height: 4px; }
  .split.thick { height: 8px; }
  .split i { border-radius: 4px; }
  .split .y { background: var(--yes); }
  .split .n { background: var(--no); }
  .split .e { background: var(--cocoa); }
  .split i.dim { opacity: .3; }
  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 13.5px;
    color: var(--latte);
  }
  .foot .val { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--cream); }
  b.t-yes, b.t-no { font-weight: 700; }
  .delta { font-family: var(--display); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .delta.plus { color: var(--yes); }
  .delta.minus { color: var(--no); }
  .delta.zero { color: var(--latte); opacity: .7; }
  .empty {
    padding: 32px 20px;
    text-align: center;
    font-size: 14.5px;
    color: var(--latte);
    border: 1px dashed var(--cocoa);
    border-radius: 18px;
  }

  /* ---------- Профиль ---------- */
  .me-head { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 6px 0 4px; }
  .me-head h1 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.2; }
  .me-head .handle { margin-top: -4px; font-size: 14px; color: var(--latte); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--coal); border: 1px solid var(--cocoa); border-radius: 16px; padding: 14px 12px 12px; }
  .stat .num { font-size: 28px; }
  .stat .k { margin-top: 6px; font-size: 13px; color: var(--latte); }
  .panel {
    background: var(--coal);
    border: 1px solid var(--cocoa);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14.5px; color: var(--latte); }
  .panel .row b { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--cream); }
  .panel .row b.t-yes { color: var(--yes); }
  .panel .row b.t-no { color: var(--no); }
  .who-inline { display: inline-flex; align-items: center; gap: 8px; color: var(--cream); font-weight: 600; }
  .who-inline .ava.sm { border-color: transparent; }
  .history { margin-top: 6px; }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .hrow:first-child { border-top: 0; }
  .hrow .t { font-size: 15px; font-weight: 500; line-height: 1.3; }
  .hrow .s { margin-top: 3px; font-size: 12.5px; color: var(--latte); }

  /* ---------- Создание спора ---------- */
  .page-h { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field-h { font-size: 14px; font-weight: 600; color: var(--cream); }
  .field textarea,
  .field input {
    width: 100%;
    background: var(--coal);
    border: 1px solid var(--cocoa);
    border-radius: 14px;
    padding: 13px 14px;
    color: var(--cream);
    font: inherit;
    font-size: 16px;
    outline: none;
    color-scheme: dark;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color .15s ease;
  }
  .field textarea { resize: none; min-height: 78px; line-height: 1.35; }
  .field input[type="datetime-local"] { min-height: 50px; }
  .field textarea:focus, .field input:focus { border-color: var(--latte); }
  .field ::placeholder { color: var(--latte); opacity: .45; }
  .field.bad textarea, .field.bad input { border-color: var(--no); }
  .field-f { display: flex; justify-content: space-between; gap: 12px; }
  .count { font-size: 12px; color: var(--latte); opacity: .6; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .err { font-size: 13px; color: var(--no); }
  .err:empty { display: none; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip {
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--cocoa);
    background: var(--coal);
    text-align: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    color: var(--latte);
    transition: background .2s ease, color .2s ease;
  }
  .chip.on { background: var(--cocoa); color: var(--cream); }
  .chip:disabled { opacity: .3; cursor: default; }

  .pick-h { font-family: var(--display); font-weight: 700; font-size: 17px; margin-bottom: 12px; }
  .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick-btn {
    height: 64px;
    border-radius: 16px;
    border: 1.5px solid var(--cocoa);
    background: var(--coal);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    transition: background .2s ease, border-color .2s ease, transform .12s ease;
  }
  .pick-btn:active { transform: scale(.98); }
  .pick-btn .big { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .pick-btn .sub { font-size: 12px; color: var(--latte); }
  .pick-btn.yes .big { color: var(--yes); }
  .pick-btn.no .big { color: var(--no); }
  .pick-btn.yes.on { border-color: var(--yes); background: rgba(143, 199, 154, .10); }
  .pick-btn.no.on { border-color: var(--no); background: rgba(224, 116, 95, .10); }
  .pick-btn:disabled { opacity: .3; cursor: default; }
  .pick-row + .hint { margin-top: 10px; }
  .seg.seg2 { grid-template-columns: 1fr 1fr; }
  .seg.seg2 button { height: 42px; font-size: 14px; }
  .hint.need, .nobody.need { color: var(--copper); opacity: 1; }

  /* ---------- Доказательства ---------- */
  .proof-box { background: var(--coal); border: 1px solid rgba(224, 135, 74, .5); border-radius: 18px; padding: 16px; }
  .proof-box .pick-h { margin-bottom: 6px; }
  .file-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
  .file-btn .ic { width: 16px; height: 16px; }
  .sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .proofs { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .proofs li { display: flex; align-items: center; gap: 10px; font-size: 14px; background: var(--graphite); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .proofs .pn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proofs .pt { font-size: 12.5px; color: var(--latte); white-space: nowrap; }

  /* ---------- Страница спора ---------- */
  .eyebrow.invite { color: var(--copper); opacity: 1; }
  .bet-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: -8px; }
  .bet-title { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.25; }
  .facts { display: flex; flex-direction: column; gap: 8px; }
  .fact { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--latte); }
  .fact b { color: var(--cream); font-weight: 600; }
  .fact.link {
    align-self: flex-start;
    color: var(--cream);
    text-decoration: underline;
    text-decoration-color: var(--cocoa);
    text-underline-offset: 3px;
  }
  .bankbox {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    background: var(--coal);
    border: 1px solid var(--cocoa);
    border-radius: 18px;
    padding: 16px;
  }
  .bankbox .num { font-size: 34px; margin-top: 8px; }
  .bank-note { text-align: right; font-size: 13px; color: var(--latte); line-height: 1.45; }

  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .team { background: var(--coal); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
  .team.dim { opacity: .45; }
  .team-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .team-h .lbl { font-family: var(--display); font-weight: 800; font-size: 15px; }
  .team.yes .lbl { color: var(--yes); }
  .team.no .lbl { color: var(--no); }
  .team-h .cnt { font-size: 13px; color: var(--latte); }
  .team ul { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .team li { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .team .ava.sm { border-color: transparent; }
  .team .who { min-width: 0; flex: 1; }
  .team .nm { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .tg { font-size: 11.5px; color: var(--latte); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ok-mark { color: var(--yes); display: inline-flex; }
  .wait-mark { color: var(--latte); opacity: .6; font-weight: 700; letter-spacing: 1px; }
  .ans { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
  .ans.yes { color: var(--yes); background: rgba(143, 199, 154, .12); }
  .ans.no { color: var(--no); background: rgba(224, 116, 95, .12); }
  .ans.none { color: var(--latte); background: rgba(199, 178, 153, .10); font-weight: 600; white-space: nowrap; }
  .rt { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
  .rt .ic { width: 11px; height: 11px; }
  .rt.low { color: var(--no); }

  /* ---------- Рейтинг в профиле ---------- */
  .meter { height: 8px; border-radius: 4px; background: var(--cocoa); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--latte); }
  .meter.low i { background: var(--no); }
  .panel .row.small { font-size: 13.5px; }
  .panel .row.small b { font-size: 13.5px; }
  .panel .row > span { display: inline-flex; align-items: center; gap: 7px; }
  .rhist { display: flex; flex-direction: column; }
  .rhist .hrow .t { font-size: 14px; }
  .rhist .delta { font-size: 14px; }
  .free-seats {
    margin-top: -8px;
    text-align: center;
    font-size: 13px;
    color: var(--latte);
    border: 1px dashed var(--cocoa);
    border-radius: 12px;
    padding: 9px;
  }
  .note-box {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--coal);
    border: 1px solid var(--cocoa);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 14.5px;
    color: var(--latte);
  }
  .note-box b { color: var(--cream); }
  .note-box b.t-yes { color: var(--yes); }
  .note-box b.t-no { color: var(--no); }
  .note-box .ic { margin-top: 3px; }
  .note-box.warn { border-color: rgba(224, 135, 74, .5); }

  .result { text-align: center; padding: 22px 16px 18px; border-radius: 22px; border: 1px solid var(--cocoa); background: var(--coal); }
  .result.win { border-color: rgba(143, 199, 154, .45); background: linear-gradient(180deg, rgba(143, 199, 154, .12), rgba(143, 199, 154, 0) 70%), var(--coal); }
  .result.lose { border-color: rgba(224, 116, 95, .45); background: linear-gradient(180deg, rgba(224, 116, 95, .12), rgba(224, 116, 95, 0) 70%), var(--coal); }
  .result-h { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
  .result.win .result-h, .result.win .num { color: var(--yes); }
  .result.lose .result-h, .result.lose .num { color: var(--no); }
  .result .num { font-size: 52px; margin-top: 12px; }
  .result .cur { margin-top: 4px; color: var(--latte); }
  .result p { margin-top: 12px; font-size: 15.5px; }
  .result-f { margin-top: 6px; font-size: 13px; color: var(--latte); }

  .demo { border: 1px dashed var(--cocoa); border-radius: 16px; padding: 12px 14px; }
  .demo-h { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--latte); opacity: .8; }
  .demo p { margin-top: 4px; font-size: 12.5px; color: var(--latte); opacity: .7; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* ---------- Приветствие ---------- */
  .screen.onb { gap: 28px; padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 28px); }
  .open-tg {

  .hello h1 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.15; }
  .hello p { margin-top: 10px; color: var(--latte); }
  .bank {
    position: relative;

  .bank .amount { margin-top: 10px; }
  .bank .amount .num { font-size: 52px; }
  .bank .note { margin-top: 14px; font-size: 14px; color: var(--latte); opacity: .85; max-width: 68%; position: relative; }
  .bank .ghost { position: absolute; right: -34px; bottom: -40px; width: 128px; opacity: .35; pointer-events: none; }
  .how h2 { margin-bottom: 4px; }
  .how ol { list-style: none; }
  .how li { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 14px 0; }
  .how li + li { border-top: 1px solid var(--line); }
  .how .n {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--cocoa);

    place-items: center;
    font-family: var(--display);

  }
  .how b { display: block; font-weight: 600; font-size: 16px; }
  .how p { margin-top: 3px; font-size: 14.5px; color: var(--latte); }
  .pill { display: inline-block; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 22px; vertical-align: 1px; }
  .pill.yes { color: var(--yes); background: rgba(143, 199, 154, .12); border: 1px solid rgba(143, 199, 154, .35); }
  .pill.no { color: var(--no); background: rgba(224, 116, 95, .12); border: 1px solid rgba(224, 116, 95, .35); }
  .rise { opacity: 0; transform: translateY(12px); animation: rise .6s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: var(--d, 0s); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ---------- Подтверждение ---------- */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 12px calc(var(--safe-bottom) + 12px);

    pointer-events: none;

  }
  .sheet.show { opacity: 1; pointer-events: auto; }
  .sheet-card {
    width: 100%;
    max-width: 456px;
    background: var(--coal);
    border: 1px solid var(--cocoa);
    border-radius: 22px;
    padding: 20px;
    transform: translateY(24px);
    transition: transform .25s cubic-bezier(.2, .7, .2, 1);
  }
  .sheet.show .sheet-card { transform: none; }
  .sheet-card h3 { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.3; }
  .sheet-card p { margin-top: 8px; font-size: 14.5px; color: var(--latte); }
  .sheet-actions { margin-top: 18px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .sheet-actions .btn { height: 50px; font-size: 14px; }

  /* ---------- Тост ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 24px);
    width: calc(100% - 32px);
    max-width: 448px;
    transform: translate(-50%, 16px);
    opacity: 0;
    pointer-events: none;
    background: var(--coal);
    border: 1px solid var(--cocoa);
    border-radius: 14px;
    padding: 13px 16px;
    font-size: 14.5px;
    color: var(--cream);
    box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .7);
    transition: opacity .25s ease, transform .25s ease;
    z-index: 30;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .rise, .screen.enter { animation: none; opacity: 1; transform: none; }
  }
</style>

<body>
  <div id="app"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     Telegram
     ===================================================================== */
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  const atLeast = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
  const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
  const startParam = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : null;
  const BOT = 'stavnavsebot';
  const DEMO = true; // тестовый режим: тестовые данные + кнопки, которые изображают других людей

  if (tg) {
    tg.ready();
    tg.expand();
    try { if (atLeast('6.1')) tg.setBackgroundColor('#0F0F0F'); } catch (e) {}
    try { if (atLeast('6.9')) tg.setHeaderColor('#0F0F0F'); } catch (e) {}
    try { if (atLeast('7.10')) tg.setBottomBarColor('#0F0F0F'); } catch (e) {}
    try { if (atLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  }

  function haptic(kind) {
    try {
      if (!atLeast('6.1')) return;
      if (kind === 'select') tg.HapticFeedback.selectionChanged();
      else tg.HapticFeedback.impactOccurred(kind || 'light');
    } catch (e) {}
  }
  function notify(type) {
    try { if (atLeast('6.1')) tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* =====================================================================
     Помощники
     ===================================================================== */
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  const virts = n => plural(n, 'вирт', 'вирта', 'виртов');
  const people = n => plural(n, 'человек', 'человека', 'человек');
  const fmt = n => Number(n).toLocaleString('ru-RU');
  const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));

  const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const z2 = n => String(n).padStart(2, '0');
  const dateShort = ts => { const d = new Date(ts); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const dateTime = ts => { const d = new Date(ts); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${z2(d.getHours())}:${z2(d.getMinutes())}`; };
  const hhmm = ts => { const d = new Date(ts); return z2(d.getHours()) + ':' + z2(d.getMinutes()); };
  function mmss(ms) {
    if (ms <= 0) return '00:00';
    const s = Math.floor(ms / 1000);
    return z2(Math.floor(s / 60)) + ':' + z2(s % 60);
  }
  // «11 ч 05 мин», а в последний час — «59:59»
  function longLeft(ms) {
    if (ms <= 0) return '00:00';
    const h = Math.floor(ms / HOUR), m = Math.floor((ms % HOUR) / MIN);
    return h ? `${h} ч ${z2(m)} мин` : mmss(ms);
  }
  const toLocalInput = ts => {
    const d = new Date(ts);
    return `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}T${z2(d.getHours())}:${z2(d.getMinutes())}`;
  };
  const fromLocalInput = s => { const t = new Date(s).getTime(); return isNaN(t) ? null : t; };
  function isUrl(s) {
    try {
      const u = new URL(s);
      return (u.protocol === 'http:' || u.protocol === 'https:') && u.hostname.indexOf('.') > 0;
    } catch (e) { return false; }
  }
  function hostOf(s) { try { return new URL(s).hostname.replace(/^www\./, ''); } catch (e) { return s; } }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* =====================================================================
     Тестовые данные. Потом их будет отдавать сервер — экраны не изменятся.
     ===================================================================== */
  const START_BALANCE = 500, MIN_STAKE = 10, MAX_TITLE = 120;
  const VOTE_WINDOW = 12 * HOUR; // сколько времени даём участникам, чтобы отметить итог
  const voteHoursText = () => { const h = VOTE_WINDOW / HOUR; return h + ' ' + plural(h, 'час', 'часа', 'часов'); };
  const ME = 1;

  const users = {
    1: { id: 1, name: (tgUser && tgUser.first_name) || 'Гость', username: tgUser && tgUser.username, photo: tgUser && tgUser.photo_url },
    2: { id: 2, name: 'Саня' },
    3: { id: 3, name: 'Дима', rating_base: 70 },
    4: { id: 4, name: 'Катя' },
    5: { id: 5, name: 'Лёша', rating_base: 70 },
    6: { id: 6, name: 'Маша' }
  };

  // участник: кто, на какой стороне, когда вошёл, какой итог отметил
  const p = (user_id, side, joined_at, report) => ({ user_id, side, joined_at, report: report || null });

  // Приглашение от Кати — чтобы проверить вход в чужой спор (ссылка ...?startapp=bet_demo)
  const onHour = ts => { const d = new Date(ts); d.setMinutes(0, 0, 0); return d.getTime(); };
  function demoInvite(now) {
    return { id: 'demo', title: 'В Петербурге на выходных не будет дождя', source: 'https://www.gismeteo.ru/weather-sankt-peterburg-4079/',
      stake: 50, size: 4, creator: 4, status: 'recruiting', created_at: now - 7 * MIN, result_at: onHour(now + 4 * DAY),
      participants: [p(4, 'yes', now - 7 * MIN), p(2, 'no', now - 4 * MIN)] };
  }

  // status: recruiting — набор, active — идёт, review — на проверке у арбитра,
  //         resolved — завершён, cancelled — отменён
  // result_at — когда станет известен итог (с этого момента можно отмечать результат)
  function seed() {
    const now = Date.now();
    return [
      { id: 'r1', title: 'В субботу в Москве выпадет снег', source: 'https://yandex.ru/pogoda/moscow',
        stake: 100, size: 4, creator: 1, status: 'recruiting', created_at: now - 18 * MIN, result_at: onHour(now + 3 * DAY),
        participants: [p(1, 'yes', now - 18 * MIN), p(4, 'no', now - 11 * MIN)] },

      { id: 'a1', title: 'Саня пробежит полумарафон быстрее 2 часов', source: 'https://russiarunning.com',
        stake: 100, size: 3, creator: 5, status: 'active', created_at: now - 2 * DAY - HOUR, started_at: now - 2 * DAY, result_at: onHour(now + 2 * DAY),
        participants: [p(5, 'no', now - 2 * DAY - HOUR), p(1, 'yes', now - 2 * DAY - 40 * MIN), p(2, 'yes', now - 2 * DAY - 20 * MIN)] },

      { id: 'a2', title: 'Пробки в Москве в час пик дойдут до 9 баллов', source: 'https://yandex.ru/maps/213/moscow/probki',
        stake: 50, size: 3, creator: 1, status: 'active', created_at: now - 3 * DAY - HOUR, started_at: now - 3 * DAY, result_at: onHour(now - 6 * HOUR),
        participants: [p(1, 'no', now - 3 * DAY - HOUR), p(3, 'yes', now - 3 * DAY - 30 * MIN, 'yes'), p(6, 'yes', now - 3 * DAY - 10 * MIN, 'yes')] },

      { id: 'a3', title: 'Лёша сделает 50 отжиманий за раз', verify: 'on_demand', source: null,
        stake: 100, size: 2, creator: 5, status: 'review', created_at: now - 4 * DAY - HOUR, started_at: now - 4 * DAY, result_at: onHour(now - DAY),
        review_reason: 'disagree', review_at: now - 20 * HOUR, proof_requested_at: now - 3 * HOUR, proofs: [],
        participants: [p(5, 'no', now - 4 * DAY - HOUR, 'no'), p(1, 'yes', now - 4 * DAY - 30 * MIN, 'yes')] },

      { id: 'f1', title: 'Пицца приедет быстрее 30 минут', source: 'https://eda.yandex.ru',
        stake: 50, size: 3, creator: 1, status: 'resolved', outcome: 'yes', resolved_by: 'agreement', resolved_at: now - DAY - 3 * HOUR,
        participants: [p(1, 'yes', now - 2 * DAY, 'yes'), p(2, 'no', now - 2 * DAY + 5 * MIN, 'yes'), p(3, 'no', now - 2 * DAY + 9 * MIN, 'yes')] },

      { id: 'f2', title: 'Наша группа выиграет квиз в пятницу', source: 'https://quizplease.ru',
        stake: 100, size: 5, creator: 4, status: 'resolved', outcome: 'yes', resolved_by: 'agreement', resolved_at: now - 3 * DAY - 5 * HOUR,
        participants: [p(4, 'yes', now - 6 * DAY, 'yes'), p(1, 'yes', now - 6 * DAY + 3 * MIN, 'yes'), p(2, 'yes', now - 6 * DAY + 7 * MIN, 'yes'),
                       p(3, 'no', now - 6 * DAY + 12 * MIN, 'yes'), p(5, 'no', now - 6 * DAY + 20 * MIN, 'yes')] },

      { id: 'c1', title: 'Идём в кино в субботу', source: 'https://afisha.yandex.ru',
        stake: 100, size: 3, creator: 4, status: 'cancelled', cancel_reason: 'timeout', created_at: now - 5 * DAY - HOUR, resolved_at: now - 5 * DAY,
        participants: [p(4, 'yes', now - 5 * DAY - HOUR), p(1, 'yes', now - 5 * DAY - 40 * MIN)] },

      { id: 'f3', title: 'Маша доест острый рамен до конца', verify: 'on_demand', source: null,
        stake: 50, size: 4, creator: 1, status: 'resolved', outcome: 'no', resolved_by: 'agreement', resolved_at: now - 6 * DAY - 2 * HOUR,
        participants: [p(1, 'no', now - 7 * DAY, 'no'), p(6, 'yes', now - 7 * DAY + 4 * MIN, 'no'), p(4, 'no', now - 7 * DAY + 6 * MIN, 'no'), p(3, 'no', now - 7 * DAY + 15 * MIN, 'no')] },

      { id: 'f4', title: 'Лёша сдаст на права с первого раза', source: 'https://gosuslugi.ru',
        stake: 100, size: 2, creator: 5, status: 'resolved', outcome: 'yes', resolved_by: 'arbiter', resolved_at: now - 9 * DAY,
        participants: [p(5, 'yes', now - 14 * DAY, 'yes'), p(1, 'no', now - 14 * DAY + 30 * MIN, 'no')] },

      { id: 'f5', title: 'Саня встанет к первой паре', source: 'https://t.me/stavnavsebot',
        stake: 50, size: 2, creator: 1, status: 'resolved', outcome: 'yes', resolved_by: 'agreement', resolved_at: now - 12 * DAY,
        participants: [p(1, 'no', now - 13 * DAY, 'yes'), p(2, 'yes', now - 13 * DAY + 10 * MIN, 'yes')] },

      demoInvite(now)
    ];
  }

  // В прототипе споры хранятся на этом телефоне. С сервером они будут общими для всех.
  const KEY = 'snv_proto_v2';
  function load() {
    try {
      const d = JSON.parse(store.get(KEY) || 'null');
      if (d && Array.isArray(d.bets)) return d.bets;
    } catch (e) {}
    return seed();
  }
  function save() { store.set(KEY, JSON.stringify({ v: 1, bets })); }

  let bets = load();
  (function freshInvite() {
    // приглашение остаётся «свежим», пока ты в него не вошёл
    const i = bets.findIndex(b => b.id === 'demo');
    const fresh = demoInvite(Date.now());
    if (i < 0) bets.push(fresh);
    else if (!bets[i].participants.some(x => x.user_id === ME)) bets[i] = fresh;
    save();
  })();

  /* =====================================================================
     Правила (на сервере будут те же самые)
     ===================================================================== */
  const bank = b => b.stake * b.participants.length;
  const mine = b => b.participants.find(x => x.user_id === ME) || null;
  const isCreator = b => b.creator === ME;
  const isLive = b => b.status === 'recruiting' || b.status === 'active' || b.status === 'review';
  const sideCount = (b, s) => b.participants.filter(x => x.side === s).length;
  const seatsLeft = b => b.size - b.participants.length;
  const deadlineOf = b => b.created_at + HOUR;
  const canReport = b => b.status === 'active' && Date.now() >= b.result_at;
  const voteDeadline = b => b.result_at + VOTE_WINDOW;
  const needsMe = b => { const m = mine(b); return !!(m && canReport(b) && !m.report); };
  const onDemand = b => b.verify === 'on_demand' || !b.source;
  const needsProof = b => !!(b.status === 'review' && b.proof_requested_at && mine(b) && !(b.proofs || []).some(x => x.user_id === ME));

  // Последнее место можно занять только так, чтобы в споре были обе стороны
  function allowedSides(b) {
    if (seatsLeft(b) === 1) {
      if (!sideCount(b, 'yes')) return ['yes'];
      if (!sideCount(b, 'no')) return ['no'];
    }
    return ['yes', 'no'];
  }

  // Банк делится поровну между победителями, остаток — тому, кто вошёл раньше
  function payouts(b) {
    const res = {};
    if (b.status !== 'resolved') return res;
    const winners = b.participants.filter(x => x.side === b.outcome).sort((x, y) => x.joined_at - y.joined_at);
    if (!winners.length) return res;
    const total = bank(b), share = Math.floor(total / winners.length), rest = total - share * winners.length;
    winners.forEach((w, i) => { res[w.user_id] = share + (i === 0 ? rest : 0); });
    return res;
  }
  const myNet = b => b.status === 'resolved' ? (payouts(b)[ME] || 0) - b.stake : 0;

  function summary() {
    let frozen = 0, net = 0, wins = 0, losses = 0, running = 0;
    bets.forEach(b => {
      const m = mine(b);
      if (!m) return;
      if (isLive(b)) frozen += b.stake;
      if (b.status === 'active' || b.status === 'review') running++;
      if (b.status === 'resolved') {
        net += myNet(b);
        if (m.side === b.outcome) wins++; else losses++;
      }
    });
    return { available: START_BALANCE + net - frozen, frozen, net, wins, losses, running, total: wins + losses + running };
  }

  function validateNew(f) {
    const errors = {};
    const title = String(f.title || '').trim();
    if (title.length < 5) errors.title = 'Опиши спор хотя бы парой слов';
    else if (title.length > MAX_TITLE) errors.title = `Не длиннее ${MAX_TITLE} символов`;
    if (f.verify !== 'on_demand' && !isUrl(String(f.source || '').trim())) errors.source = 'Нужна ссылка, которая начинается с http:// или https://';
    if (!f.result_at) errors.result_at = 'Укажи, когда станет известен итог';
    else if (f.result_at < Date.now() + HOUR) errors.result_at = 'Не раньше чем через час — пока идёт набор, итог не должен быть известен';
    const avail = summary().available;
    if (!Number.isInteger(f.stake) || f.stake < MIN_STAKE) errors.stake = `Ставка — целое число, минимум ${MIN_STAKE} виртов`;
    else if (f.stake > avail) errors.stake = `Не хватает: у тебя ${fmt(avail)} ${virts(avail)}`;
    if (!(f.size >= 2 && f.size <= 5)) errors.size = 'От 2 до 5 человек';
    if (f.side !== 'yes' && f.side !== 'no') errors.side = 'Выбери свою сторону';
    return errors;
  }

  function startBet(b) { b.status = 'active'; b.started_at = Date.now(); b.size = b.participants.length; }

  function settle(b) {
    if (b.participants.some(x => !x.report)) return;
    const first = b.participants[0].report;
    if (b.participants.every(x => x.report === first)) {
      b.status = 'resolved'; b.outcome = first; b.resolved_by = 'agreement'; b.resolved_at = Date.now();
    } else {
      b.status = 'review'; b.review_reason = 'disagree'; b.review_at = Date.now();
    }
  }

  // Автоматика по времени:
  // — набор не начался за час: спор отменяется, ставки возвращаются;
  // — за 12 часов после даты итога ответили не все: спор уходит арбитру.
  function sweep() {
    let changed = false;
    bets.forEach(b => {
      if (b.status === 'recruiting' && Date.now() >= deadlineOf(b)) {
        b.status = 'cancelled'; b.cancel_reason = 'timeout'; b.resolved_at = deadlineOf(b); changed = true;
      } else if (b.status === 'active' && Date.now() >= voteDeadline(b)) {
        b.status = 'review'; b.review_reason = 'timeout'; b.review_at = voteDeadline(b); changed = true;
      }
    });
    if (changed) save();
    return changed;
  }

  /* ---------- Рейтинг ----------
     Не зависит от того, выиграл человек или проиграл, — только от того,
     отметил ли он итог за 12 часов и был ли этот итог верным.
     У всех старт 100, это же максимум.
     Отметил верный итог вовремя: +5 (не выше 100).
     Отметил неверный итог (арбитр решил иначе): −20.
     Не отметил итог за 12 часов: −10. Ниже 0 не опускается. */
  const RATING = { start: 100, max: 100, honest: 5, mismatch: -20, silent: -10 };

  function rating(uid) {
    const events = [];
    bets.forEach(b => {
      const x = b.participants.find(q => q.user_id === uid);
      if (!x) return;
      const timedOut = b.review_reason === 'timeout' && (b.status === 'review' || b.status === 'resolved');
      if (timedOut && !x.report) events.push({ bet: b, at: b.review_at || voteDeadline(b), delta: RATING.silent, why: 'silent' });
      if (b.status === 'resolved' && x.report) {
        const ok = x.report === b.outcome;
        events.push({ bet: b, at: b.resolved_at, delta: ok ? RATING.honest : RATING.mismatch, why: ok ? 'honest' : 'mismatch' });
      }
    });
    events.sort((a, c) => a.at - c.at);
    const u = users[uid];
    let value = u && u.rating_base != null ? u.rating_base : RATING.start;
    const byBet = {}, history = [];
    events.forEach(e => {
      const next = Math.max(0, Math.min(RATING.max, value + e.delta));
      const applied = next - value;
      byBet[e.bet.id] = { applied, why: e.why };
      if (applied) history.push({ bet: e.bet, at: e.at, applied, why: e.why });
      value = next;
    });
    return { value, byBet, history: history.reverse() };
  }
  const RATING_WHY = {
    honest: 'честный ответ вовремя',
    mismatch: 'неверный ответ, арбитр решил иначе',
    silent: 'нет ответа за 12 часов'
  };

  // Действия. Сейчас меняют тестовые данные, потом станут запросами к серверу.
  const api = {
    create(f) {
      const errors = validateNew(f);
      if (Object.keys(errors).length) return { errors };
      const now = Date.now();
      const byDemand = f.verify === 'on_demand';
      const b = { id: uid(), title: f.title.trim(), verify: byDemand ? 'on_demand' : 'link', source: byDemand ? null : f.source.trim(),
        stake: f.stake, size: f.size, creator: ME,
        status: 'recruiting', created_at: now, result_at: f.result_at, participants: [p(ME, f.side, now)] };
      bets.unshift(b);
      save();
      return { bet: b };
    },
    join(b, side) {
      if (b.status !== 'recruiting') return 'Набор уже закрыт';
      if (mine(b)) return 'Ты уже в этом споре';
      if (seatsLeft(b) < 1) return 'Мест не осталось';
      if (allowedSides(b).indexOf(side) < 0) return 'Последнее место — только за другую сторону';
      if (b.stake > summary().available) return 'Не хватает виртов';
      b.participants.push(p(ME, side, Date.now()));
      if (seatsLeft(b) === 0) startBet(b);
      save();
      return null;
    },
    start(b) {
      if (!isCreator(b) || b.status !== 'recruiting') return 'Начать может только автор, пока идёт набор';
      if (!sideCount(b, 'yes') || !sideCount(b, 'no')) return 'Нужен хотя бы один человек на каждой стороне';
      startBet(b);
      save();
      return null;
    },
    cancel(b) {
      if (!isCreator(b) || b.status !== 'recruiting') return 'Отменить можно только до старта';
      b.status = 'cancelled'; b.cancel_reason = 'creator'; b.resolved_at = Date.now();
      save();
      return null;
    },
    report(b, side) {
      const m = mine(b);
      if (!m || !canReport(b)) return 'Сейчас отметить итог нельзя';
      if (Date.now() >= voteDeadline(b)) return 'Время на ответ вышло — итог решит арбитр';
      if (m.report) return 'Ты уже отметил итог';
      m.report = side;
      settle(b);
      save();
      return null;
    },
    // Фото или видео для арбитра. В прототипе сохраняем только название файла,
    // с сервером файл будет уходить арбитру.
    sendProof(b, file) {
      if (b.status !== 'review' || !b.proof_requested_at) return 'Сейчас доказательства не нужны';
      if (!mine(b)) return 'Отправлять могут только участники спора';
      b.proofs = b.proofs || [];
      if (b.proofs.filter(x => x.user_id === ME).length >= 5) return 'Хватит пяти файлов';
      const ext = String(file.name.split('.').pop() || '').toLowerCase();
      const kind = /^video\//.test(file.type) || /^(mp4|mov|m4v|webm|avi|3gp)$/.test(ext) ? 'video'
                 : /^image\//.test(file.type) || /^(jpe?g|png|heic|heif|webp|gif)$/.test(ext) ? 'photo' : 'file';
      b.proofs.push({ user_id: ME, name: file.name, kind, at: Date.now() });
      save();
      return null;
    }
  };

  // Тестовый режим: изображаем действия других людей
  const freeFakes = b => Object.values(users).filter(u => u.id !== ME && !b.participants.some(x => x.user_id === u.id));
  const demo = {
    addParticipant(b) {
      const free = freeFakes(b);
      if (!free.length || seatsLeft(b) < 1 || b.status !== 'recruiting') return;
      const sides = allowedSides(b);
      const side = sides.length === 1 ? sides[0] : (sideCount(b, 'yes') <= sideCount(b, 'no') ? 'yes' : 'no');
      b.participants.push(p(free[0].id, side, Date.now()));
      if (seatsLeft(b) === 0) startBet(b);
      save();
    },
    fastForward(b) {
      if (b.status === 'active') { b.result_at = Date.now() - 1000; save(); }
    },
    timeUp(b) {
      if (b.status === 'active') { b.result_at = Date.now() - VOTE_WINDOW - 1000; save(); }
    },
    othersReport(b, agree) {
      const m = mine(b);
      if (!m || !m.report) return;
      const flip = m.report === 'yes' ? 'no' : 'yes';
      b.participants.filter(x => x.user_id !== ME && !x.report)
        .forEach((x, i) => { x.report = (!agree && i === 0) ? flip : m.report; });
      settle(b);
      save();
    },
    requestProof(b) {
      if (b.status === 'review' && !b.proof_requested_at) { b.proof_requested_at = Date.now(); b.proofs = b.proofs || []; save(); }
    },
    arbiter(b, outcome) {
      if (b.status !== 'review') return;
      b.status = 'resolved'; b.outcome = outcome; b.resolved_by = 'arbiter'; b.resolved_at = Date.now();
      save();
    }
  };

  /* =====================================================================
     Кусочки интерфейса
     ===================================================================== */
  const svg = d => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
  const ICON = {
    clock: svg('<circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/>'),
    lock: svg('<rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>'),
    left: svg('<path d="M10 3 5 8l5 5"/>'),
    link: svg('<path d="M6.5 9.5l3-3"/><path d="M7.5 4.5l1-1a2.8 2.8 0 0 1 4 4l-1 1"/><path d="M8.5 11.5l-1 1a2.8 2.8 0 0 1-4-4l1-1"/>'),
    out: svg('<path d="M5 11 11 5"/><path d="M6 5h5v5"/>'),
    flag: svg('<path d="M4 14V2.5"/><path d="M4 3h7.5L10 5.5 11.5 8H4"/>'),
    user: svg('<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.8-2.3 2.7-3.5 5-3.5s4.2 1.2 5 3.5"/>'),
    check: svg('<path d="M3.5 8.5l3 3 6-7"/>'),
    scale: svg('<path d="M8 2.5v11"/><path d="M5 13.5h6"/><path d="M3 4.5h10"/><path d="M3 4.5 1.5 8.5h3z"/><path d="M13 4.5l-1.5 4h3z"/>'),
    camera: svg('<rect x="1.5" y="4.5" width="13" height="9" rx="2"/><circle cx="8" cy="9" r="2.5"/><path d="M5.5 4.5 6.5 2.5h3l1 2"/>'),
    video: svg('<rect x="1.5" y="4" width="9" height="8" rx="1.5"/><path d="M10.5 7l4-2v6l-4-2z"/>'),
    photo: svg('<rect x="1.5" y="2.5" width="13" height="11" rx="2"/><circle cx="5.5" cy="6.5" r="1.3"/><path d="M14.5 11l-4-4-6 6.5"/>'),
    clip: svg('<path d="M13 7.5 8 12.5a3 3 0 0 1-4.2-4.2l5.3-5.3a2 2 0 0 1 2.8 2.8L6.6 11a1 1 0 0 1-1.4-1.4L10 4.8"/>'),
    shield: svg('<path d="M8 1.8 13 3.6v4.1c0 3-2.1 5.4-5 6.5-2.9-1.1-5-3.5-5-6.5V3.6z"/>')
  };

  const mark = cls => `
    <svg class="${cls}" viewBox="0 0 96 84" aria-hidden="true">
      <defs><clipPath id="clip-${cls}"><rect x="34" y="28" width="58" height="42" rx="13"/></clipPath></defs>
      <rect x="4" y="4" width="58" height="42" rx="13" fill="#C7B299"/>
      <path d="M14 40 L10 58 L30 44 Z" fill="#C7B299"/>
      <rect x="34" y="28" width="58" height="42" rx="13" fill="#8C6A4F"/>
      <path d="M82 64 L88 82 L66 68 Z" fill="#8C6A4F"/>
      <rect x="4" y="4" width="58" height="42" rx="13" fill="#4A3B31" clip-path="url(#clip-${cls})"/>
      <path d="M38.5 37 L46 44.5 L59.5 31" fill="none" stroke="#E0874A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

  const initial = name => String(name || '?').trim().charAt(0).toUpperCase();
  function ava(u, cls) {
    const inner = u.photo ? `<img src="${esc(u.photo)}" alt="">` : esc(initial(u.name));
    return `<span class="ava c${u.id % 4} ${cls || ''}" title="${esc(u.name)}">${inner}</span>`;
  }
  function faces(list, open) {
    if (!list.length) return `<span class="nobody">${open ? 'пока никого' : 'никого'}</span>`;
    return '<span class="faces">' + list.map(x => ava(users[x.user_id], 'sm' + (x.user_id === ME ? ' me' : ''))).join('') + '</span>';
  }
  const seg = (k, n, dim) => n ? `<i class="${k}${dim ? ' dim' : ''}" style="flex:${n}"></i>` : '';
  const sideWord = s => s === 'yes' ? '<b class="t-yes">«Да»</b>' : '<b class="t-no">«Нет»</b>';
  const sideName = s => s === 'yes' ? 'Да' : 'Нет';
  const backLink = () => inTelegram ? '' : `<button class="back" type="button" data-back>${ICON.left}Назад</button>`;
  const nameOf = id => id === ME ? 'Ты' : users[id].name;

  function statusInfo(b) {
    if (b.status === 'recruiting') return { text: `Набор · ${b.participants.length} из ${b.size}`, cls: '' };
    if (b.status === 'active') return { text: 'Идёт', cls: '' };
    if (b.status === 'review') return { text: 'На проверке', cls: '' };
    if (b.status === 'resolved') {
      const m = mine(b);
      if (!m) return { text: 'Завершён', cls: '' };
      return m.side === b.outcome ? { text: 'Победа', cls: 't-yes' } : { text: 'Проигрыш', cls: 't-no' };
    }
    return { text: 'Отменён', cls: 'muted' };
  }

  function card(b) {
    const yes = b.participants.filter(x => x.side === 'yes');
    const no = b.participants.filter(x => x.side === 'no');
    const m = mine(b);
    const open = b.status === 'recruiting';
    const free = open ? seatsLeft(b) : 0;
    const resolved = b.status === 'resolved', cancelled = b.status === 'cancelled';
    const dimYes = (resolved && b.outcome !== 'yes') || cancelled;
    const dimNo = (resolved && b.outcome !== 'no') || cancelled;
    const st = statusInfo(b);
    const bankLine = `Банк <b class="val">${fmt(bank(b))}</b>`;
    let right, foot;

    if (open) {
      right = `<span class="meta">${ICON.clock}<span data-deadline="${deadlineOf(b)}">${mmss(deadlineOf(b) - Date.now())}</span></span>`;
      foot = `<span>${bankLine} · ставка ${fmt(b.stake)}</span><span>ещё ${free} ${plural(free, 'место', 'места', 'мест')}</span>`;
    } else if (b.status === 'review') {
      right = needsProof(b) ? '<span class="chip-action">Нужны доказательства</span>' : '<span class="meta">решает арбитр</span>';
      foot = `<span>${bankLine}</span><span>ты за ${sideWord(m.side)}</span>`;
    } else if (b.status === 'active') {
      const reported = b.participants.filter(x => x.report).length;
      right = !canReport(b)
        ? `<span class="meta">${ICON.clock}итог ${dateShort(b.result_at)}</span>`
        : needsMe(b)
          ? '<span class="chip-action">Отметь итог</span>'
          : `<span class="meta">итог отметили ${reported} из ${b.participants.length}</span>`;
      foot = `<span>${bankLine}</span><span>ты за ${sideWord(m.side)}</span>`;
    } else if (resolved) {
      const won = m.side === b.outcome;
      right = `<span class="meta">${dateShort(b.resolved_at)}</span>`;
      foot = `<span>${bankLine} · исход ${sideWord(b.outcome)}</span><span class="delta ${won ? 'plus' : 'minus'}">${signed(myNet(b))}</span>`;
    } else {
      right = `<span class="meta">${dateShort(b.resolved_at)}</span>`;
      foot = `<span>Ставка ${fmt(b.stake)} вернулась</span><span class="delta zero">0</span>`;
    }

    return `
      <article class="card${needsMe(b) || needsProof(b) ? ' attention' : ''}" data-bet="${esc(b.id)}" role="button" tabindex="0">
        <div class="top"><span class="status ${st.cls}">${st.text}</span>${right}</div>
        <h3>${esc(b.title)}</h3>
        <div class="sides">
          <div class="side yes${dimYes ? ' dim' : ''}"><span class="lbl">Да</span>${faces(yes, open)}</div>
          <div class="side no${dimNo ? ' dim' : ''}">${faces(no, open)}<span class="lbl">Нет</span></div>
        </div>
        <div class="split">${seg('y', yes.length, dimYes)}${seg('e', free)}${seg('n', no.length, dimNo)}</div>
        <div class="foot">${foot}</div>
      </article>`;
  }

  // Две команды: кто за «Да», кто за «Нет».
  // mode: plain — просто люди; reports — кто уже отметил итог (без ответа); answers — кто что ответил
  function teams(b, mode) {
    const col = side => {
      const list = b.participants.filter(x => x.side === side).sort((x, y) => x.joined_at - y.joined_at);
      const dim = (b.status === 'resolved' && b.outcome !== side) || b.status === 'cancelled';
      const rows = list.map(x => {
        const r = rating(x.user_id).value;
        const sub = `<div class="tg"><span class="rt${r < 70 ? ' low' : ''}" title="рейтинг">${ICON.shield}${r}</span></div>`;
        let right = '';
        if (mode === 'reports') right = x.report ? `<span class="ok-mark" title="отметил итог">${ICON.check}</span>` : '<span class="wait-mark" title="ещё не отметил">···</span>';
        if (mode === 'answers') right = x.report ? `<span class="ans ${x.report}">${sideName(x.report)}</span>` : '<span class="ans none" title="не отметил итог">молчит</span>';
        return `<li>${ava(users[x.user_id], 'sm')}<div class="who"><div class="nm">${esc(nameOf(x.user_id))}</div>${sub}</div>${right}</li>`;
      }).join('');
      return `
        <div class="team ${side}${dim ? ' dim' : ''}">
          <div class="team-h"><span class="lbl">${sideName(side)}</span><span class="cnt">${list.length}</span></div>
          ${list.length ? `<ul>${rows}</ul>` : b.status === 'recruiting' ? '<div class="nobody need">нужен хотя бы один</div>' : '<div class="nobody">никого</div>'}
        </div>`;
    };
    const free = b.status === 'recruiting' ? seatsLeft(b) : 0;
    return `<section class="teams">${col('yes')}${col('no')}</section>` +
      (free ? `<div class="free-seats">Свободно ещё ${free} ${plural(free, 'место', 'места', 'мест')}</div>` : '');
  }

  function resultBlock(b) {
    const m = mine(b);
    const how = b.resolved_by !== 'arbiter' ? 'все участники согласились'
      : b.review_reason === 'timeout' ? 'ответили не все, решил арбитр' : 'решил арбитр';
    if (!m) return `<div class="note-box">${ICON.flag}<span>Спор завершён: исход ${sideWord(b.outcome)}, ${how}.</span></div>`;
    const won = m.side === b.outcome, net = myNet(b);
    const line = won
      ? (sideCount(b, b.outcome) === 1 ? 'В точку. Весь банк твой.' : 'В точку. Банк делится между победителями.')
      : 'В этот раз мимо. Бывает.';
    const rt = rating(ME).byBet[b.id];
    const rtText = !rt ? ''
      : rt.applied ? `<b class="${rt.applied > 0 ? 't-yes' : 't-no'}">${signed(rt.applied)}</b> — ${RATING_WHY[rt.why]}`
      : rt.why === 'honest' ? `без изменений — у тебя и так максимум ${RATING.max}` : 'без изменений';
    return `
      <section class="result ${won ? 'win' : 'lose'}">
        <div class="result-h">${won ? 'Победа' : 'Проигрыш'}</div>
        <div class="num">${signed(net)}</div>
        <div class="cur">${virts(net)}</div>
        <p>${line}</p>
        <div class="result-f">Исход ${sideWord(b.outcome)} · ${how}</div>
        ${rtText ? `<div class="result-f">Рейтинг: ${rtText}</div>` : ''}
      </section>`;
  }

  // Спор на проверке: арбитр смотрит источник или просит доказательства
  function reviewBlock(b) {
    const m = mine(b);
    const penalty = b.review_reason === 'timeout' && m && !m.report
      ? `<p class="hint center need">−${-RATING.silent} к рейтингу: нет ответа за ${voteHoursText()}.</p>` : '';
    if (!b.proof_requested_at) {
      const reason = b.review_reason === 'timeout' ? `Не все отметили итог за ${voteHoursText()}.` : 'Мнения разошлись.';
      const what = onDemand(b)
        ? 'Арбитр попросит участников прислать доказательства — фото или видео — и решит, кто прав.'
        : 'Арбитр откроет источник и решит, кто прав.';
      return `<div class="note-box warn">${ICON.scale}<span>${reason} ${what} Ставки пока заморожены.</span></div>${penalty}`;
    }
    const proofs = b.proofs || [];
    const sent = new Set(proofs.map(x => x.user_id)).size;
    const my = proofs.filter(x => x.user_id === ME);
    const icon = k => k === 'video' ? ICON.video : k === 'photo' ? ICON.photo : ICON.clip;
    return `
      <section class="proof-box">
        <div class="pick-h">Арбитр просит доказательства</div>
        <p class="hint">Пришли фото, видео или скриншот, которые подтверждают итог. Их увидит только арбитр. Прислали ${sent} из ${b.participants.length}.</p>
        ${mine(b) ? `
          <label class="btn ghost file-btn">${ICON.clip}<span>${my.length ? 'Добавить ещё файл' : 'Прикрепить фото или видео'}</span>
            <input class="sr-file" type="file" accept="image/*,video/*" data-proof>
          </label>` : ''}
        ${my.length ? `<ul class="proofs">${my.map(x => `<li>${icon(x.kind)}<span class="pn">${esc(x.name)}</span><span class="pt">отправлено ${hhmm(x.at)}</span></li>`).join('')}</ul>` : ''}
      </section>${penalty}`;
  }

  function payoutPanel(b) {
    const pay = payouts(b);
    const winners = b.participants.filter(x => x.side === b.outcome).sort((x, y) => x.joined_at - y.joined_at);
    if (!winners.length) return '';
    const total = bank(b), rest = total - Math.floor(total / winners.length) * winners.length;
    return `
      <section class="panel">
        <div class="eyebrow">Банк ${fmt(total)} — победителям</div>
        ${winners.map(x => `<div class="row"><span class="who-inline">${ava(users[x.user_id], 'sm')}${esc(nameOf(x.user_id))}</span><b>${fmt(pay[x.user_id])}</b></div>`).join('')}
        ${rest ? `<p class="hint">Поровну не делится: остаток ${rest} ${virts(rest)} получает тот, кто вошёл в спор первым.</p>` : ''}
      </section>`;
  }

  function demoPanel(b) {
    if (!DEMO) return '';
    const m = mine(b), btns = [];
    if (b.status === 'recruiting' && m && seatsLeft(b) > 0 && freeFakes(b).length) btns.push(['add', '+ Тестовый участник']);
    if (b.status === 'active' && m && !canReport(b)) btns.push(['ff', 'Перемотать к итогу']);
    if (b.status === 'active' && m && m.report && b.participants.some(x => !x.report)) {
      btns.push(['agree', 'Остальные согласны']);
      btns.push(['disagree', 'Кто-то не согласен']);
    }
    if (b.status === 'active' && m && canReport(b) && b.participants.some(x => !x.report)) btns.push(['timeup', `Прошло ${voteHoursText()}`]);
    if (b.status === 'review' && !b.proof_requested_at) btns.push(['proof', 'Арбитр просит доказательства']);
    if (b.status === 'review') { btns.push(['arb-yes', 'Арбитр решил: «Да»']); btns.push(['arb-no', 'Арбитр решил: «Нет»']); }
    if (!btns.length) return '';
    return `
      <section class="demo">
        <div class="demo-h">Тестовый режим</div>
        <p>Этих кнопок не будет в настоящем приложении — они изображают других людей.</p>
        <div class="demo-row">${btns.map(([k, t]) => `<button type="button" data-demo="${k}">${t}</button>`).join('')}</div>
      </section>`;
  }

  /* =====================================================================
     Экраны
     ===================================================================== */
  const TABS = [['recruiting', 'Набор'], ['active', 'Идут'], ['done', 'Завершены']];
  const EMPTY = {
    recruiting: 'Сейчас ничего не собирается. Создай спор и кинь ссылку друзьям.',
    active: 'Активных споров нет. Самое время с кем-нибудь поспорить.',
    done: 'Здесь появятся споры, которые уже закончились.'
  };
  const groupOf = b => b.status === 'recruiting' ? 'recruiting' : isLive(b) ? 'active' : 'done';

  function renderHome() {
    const s = summary();
    const groups = { recruiting: [], active: [], done: [] };
    bets.forEach(b => { if (mine(b)) groups[groupOf(b)].push(b); });
    groups.recruiting.sort((a, b) => a.created_at - b.created_at);
    const rank = b => needsMe(b) || needsProof(b) ? 0 : b.status === 'active' ? 1 : 2;
    groups.active.sort((a, b) => rank(a) - rank(b) || a.result_at - b.result_at);
    groups.done.sort((a, b) => b.resolved_at - a.resolved_at);
    const list = groups[state.tab];

    return `
      <main class="screen home">
        <header class="topbar">
          <div class="logo">${mark('mark-sm')}<span>СТАВЬ НА <em>ВСЁ</em></span></div>

        </header>

        <section class="wallet">
          <div class="eyebrow">Баланс</div>
          <div class="amount"><span class="num">${fmt(s.available)}</span><span class="cur">${virts(s.available)}</span></div>
          <div class="frozen">${ICON.lock}ещё ${fmt(s.frozen)} ${virts(s.frozen)} заморожено в спорах</div>
          <button class="btn" type="button" data-action="create">Создать спор</button>
        </section>

        <nav class="seg" role="tablist">
          ${TABS.map(([k, label]) => `
            <button type="button" role="tab" data-tab="${k}" class="${state.tab === k ? 'on' : ''}" aria-selected="${state.tab === k}">
              ${label}<span class="cnt">${groups[k].length}</span>
            </button>`).join('')}
        </nav>

        <div class="list">${list.length ? list.map(card).join('') : `<div class="empty">${EMPTY[state.tab]}</div>`}</div>
      </main>`;
  }

  function renderProfile() {
    const s = summary(), u = users[ME], R = rating(ME);
    const decided = s.wins + s.losses;
    const rate = decided ? Math.round(s.wins * 100 / decided) : 0;
    const history = bets.filter(b => mine(b) && !isLive(b)).sort((a, b) => b.resolved_at - a.resolved_at);
    const stat = (v, k, cls) => `<div class="stat"><div class="num ${cls}">${fmt(v)}</div><div class="k">${k}</div></div>`;

    const hrow = b => {
      if (b.status === 'cancelled') {
        return `<div class="hrow" data-bet="${esc(b.id)}"><div><div class="t">${esc(b.title)}</div>
          <div class="s">${dateShort(b.resolved_at)} · отменён, ставка вернулась</div></div>
          <span class="delta zero">0</span></div>`;
      }
      const won = mine(b).side === b.outcome;
      return `<div class="hrow" data-bet="${esc(b.id)}"><div><div class="t">${esc(b.title)}</div>
        <div class="s">${dateShort(b.resolved_at)} · ставка ${fmt(b.stake)} · ${won ? 'победа' : 'проигрыш'}</div></div>
        <span class="delta ${won ? 'plus' : 'minus'}">${signed(myNet(b))}</span></div>`;
    };

    return `
      <main class="screen profile">
        ${backLink()}
        <header class="me-head">
          ${ava(u, 'xl')}
          <h1>${esc(u.name)}</h1>
          ${u.username ? `<div class="handle">@${esc(u.username)}</div>` : ''}
        </header>

        <section class="panel">
          <div class="row"><span>${ICON.shield} Рейтинг</span><b class="${R.value < 70 ? 't-no' : ''}">${R.value} / ${RATING.max}</b></div>
          <div class="meter${R.value < 70 ? ' low' : ''}"><i style="width:${Math.round(R.value * 100 / RATING.max)}%"></i></div>
          <p class="hint">Не зависит от того, выиграл ты или проиграл: важно только, отмечаешь ли ты итог вовремя и честно. Все начинают со ${RATING.max}.</p>
          <div class="row small"><span>Честный ответ за ${voteHoursText()}</span><b class="t-yes">+${RATING.honest}</b></div>
          <div class="row small"><span>Неверный ответ (арбитр решил иначе)</span><b class="t-no">${signed(RATING.mismatch)}</b></div>
          <div class="row small"><span>Нет ответа за ${voteHoursText()}</span><b class="t-no">${signed(RATING.silent)}</b></div>
          ${R.history.length ? `
            <div class="eyebrow" style="margin-top:4px">Последние изменения</div>
            <div class="rhist">${R.history.slice(0, 5).map(e => `
              <div class="hrow" data-bet="${esc(e.bet.id)}"><div><div class="t">${esc(e.bet.title)}</div>
                <div class="s">${dateShort(e.at)} · ${RATING_WHY[e.why]}</div></div>
                <span class="delta ${e.applied > 0 ? 'plus' : 'minus'}">${signed(e.applied)}</span></div>`).join('')}
            </div>` : ''}
        </section>

        <section class="stats">
          ${stat(s.total, plural(s.total, 'спор', 'спора', 'споров'), '')}
          ${stat(s.wins, plural(s.wins, 'победа', 'победы', 'побед'), 't-yes')}
          ${stat(s.losses, plural(s.losses, 'поражение', 'поражения', 'поражений'), 't-no')}
        </section>

        <section class="panel">
          <div class="row"><span>Процент побед</span><b>${rate}%</b></div>
          <div class="split thick">${seg('y', s.wins)}${seg('n', s.losses)}${decided ? '' : seg('e', 1)}</div>
          <div class="row"><span>Итог за всё время</span><b class="${s.net > 0 ? 't-yes' : s.net < 0 ? 't-no' : ''}">${signed(s.net)} ${virts(s.net)}</b></div>
          <div class="row"><span>Идут сейчас</span><b>${s.running}</b></div>
        </section>

        <section>
          <div class="eyebrow">История</div>
          <div class="history">${history.length ? history.map(hrow).join('') : '<div class="empty">Пока пусто. Первый спор — самый волнительный.</div>'}</div>
        </section>

        <button class="btn ghost" type="button" data-go="onboarding">Как это работает</button>
        ${DEMO ? '<button class="link-muted" type="button" data-action="reset">Сбросить тестовые данные</button>' : ''}
      </main>`;
  }

  function renderOnboarding(firstRun) {

    return `
      <main class="screen onb">

        ${firstRun ? '' : backLink()}

        <header class="brand rise">
          ${mark('mark')}
          <div>
            <div class="wordmark">СТАВЬ<br>НА <span>ВСЁ</span></div>
            <div class="tagline">Докажи, что ты прав</div>
          </div>
        </header>

        <section class="hello rise" style="--d:.08s">
          <h1>${hello}</h1>
          <p>Здесь спорят по-честному: ставки замораживаются, пока не станет ясно, кто прав.</p>
        </section>

        <section class="bank rise" style="--d:.16s">
          <div class="eyebrow">Стартовый банк</div>
          <div class="amount"><span class="num" id="startBalance">500</span><span class="cur">виртов</span></div>
          <p class="note">Игровая валюта: её нельзя купить или вывести. Спорим на интерес.</p>

            <path d="M17 4 H49 A13 13 0 0 1 62 17 V33 A13 13 0 0 1 49 46 H28 L10 58 L14 44.5 A13 13 0 0 1 4 33 V17 A13 13 0 0 1 17 4 Z"/>
            <path d="M47 28 H79 A13 13 0 0 1 92 41 V57 A13 13 0 0 1 82 69.5 L88 82 L68 70 H47 A13 13 0 0 1 34 57 V41 A13 13 0 0 1 47 28 Z"/>
          </svg>
        </section>

        <section class="how rise" style="--d:.24s">
          <h2 class="eyebrow">Как это работает</h2>
          <ol>
            <li><span class="n">1</span><div><b>Создай спор</b><p>Условие, ставка и как проверить итог. Без лишних слов.</p></div></li>
            <li><span class="n">2</span><div><b>Позови друзей</b><p>До пяти человек, каждый выбирает сторону: <span class="pill yes">Да</span> или <span class="pill no">Нет</span></p></div></li>
            <li><span class="n">3</span><div><b>Узнайте, кто прав</b><p>Все согласны с итогом — банк делится сразу. Нет — арбитр смотрит источник или просит доказательства.</p></div></li>
          </ol>

        <div class="rise" style="--d:.32s">
          <button class="btn" type="button" data-action="${firstRun ? 'welcome-done' : 'back'}">${firstRun ? 'Погнали' : 'Понятно'}</button>
          <p class="fine">Спорь на интерес, а не на нервы.</p>
        </div>
